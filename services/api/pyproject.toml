[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "smart-ecommerce-api"
version = "0.1.0"
description = "FastAPI backend for the Smart-eCommerce Management System"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "pymongo==4.19.0",
  "joblib==1.5.3",
  "numpy==2.3.5",
  "openai==3.39.0",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
  "scikit-learn==1.7.2",
  "torch==2.14.1",
  "uvicorn[standard]==0.38.0",
  "pwdlib[argon2]==0.3.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_ecommerce_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

