name: smart-ecommerce

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: smart_ecommerce
      POSTGRES_USER: smart_ecommerce
      POSTGRES_PASSWORD: smart_ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_ecommerce -d smart_ecommerce"]
      interval: 2s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0.34
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 3s
      retries: 20

  catalog-init:
    image: mongo:8.0.34
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../database/catalog:/database/catalog:ro
    entrypoint: ["mongosh", "--quiet", "mongodb://mongo:27017/smart_ecommerce"]
    command: ["--eval", "load('/database/catalog/setup.js'); load('/database/catalog/seed.synthetic.js');"]
    restart: "no"

  migrate:
    build:
      context: ../services/api
    command:
      ["python", "-m", "smart_ecommerce_api.migrate", "--seed"]
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
      SMART_ECOMMERCE_MIGRATIONS_DIR: /sql/migrations
      SMART_ECOMMERCE_SEEDS_DIR: /sql/seeds
    volumes:
      - ../database/relational:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../services/api
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
      SMART_ECOMMERCE_MONGO_URI: mongodb://mongo:27017/?directConnection=true
      SMART_ECOMMERCE_MONGO_DATABASE: smart_ecommerce
      SMART_ECOMMERCE_RECOMMENDATION_ARTIFACT: /app/artifacts/recommendation.joblib
      SMART_ECOMMERCE_IMAGE_SEARCH_ARTIFACT: /app/artifacts/image_search.json
      SMART_ECOMMERCE_FORECAST_ARTIFACT: /app/artifacts/forecast.joblib
      SMART_ECOMMERCE_ASSISTANT_KNOWLEDGE: /app/data/assistant_faq.json
      SMART_ECOMMERCE_PRICING_SEASONS: /app/data/pricing_seasons.json
      SMART_ECOMMERCE_FRAUD_ARTIFACT: /app/artifacts/fraud.joblib
      # Optional: supplied from the shell or a local .env; empty keeps the
      # assistant and voice surfaces in their typed provider-missing state.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMART_ECOMMERCE_ASSISTANT_MODEL: gpt-6-luna
      SMART_ECOMMERCE_TRANSCRIPTION_MODEL: gpt-transcribe
    depends_on:
      migrate:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  storefront:
    build:
      context: ../apps/storefront
    environment:
      # Server-side calls to the API go through the compose network.
      SMART_ECOMMERCE_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  inventory-job:
    build:
      context: ../services/api
    profiles: ["jobs"]
    command: ["python", "-m", "smart_ecommerce_api.inventory_job"]
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
      SMART_ECOMMERCE_FORECAST_ARTIFACT: /app/artifacts/forecast.joblib
    depends_on:
      postgres:
        condition: service_healthy

  pricing-job:
    build:
      context: ../services/api
    profiles: ["jobs"]
    command: ["python", "-m", "smart_ecommerce_api.pricing_job"]
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
      SMART_ECOMMERCE_PRICING_SEASONS: /app/data/pricing_seasons.json
    depends_on:
      postgres:
        condition: service_healthy

  segmentation-job:
    build:
      context: ../services/api
    profiles: ["jobs"]
    command: ["python", "-m", "smart_ecommerce_api.segmentation_job"]
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
    depends_on:
      postgres:
        condition: service_healthy

  session-reaper:
    build:
      context: ../services/api
    profiles: ["jobs"]
    command: ["python", "-m", "smart_ecommerce_api.session_reaper"]
    environment:
      SMART_ECOMMERCE_POSTGRES_DSN: postgresql://smart_ecommerce:smart_ecommerce@postgres:5432/smart_ecommerce
    depends_on:
      postgres:
        condition: service_healthy

